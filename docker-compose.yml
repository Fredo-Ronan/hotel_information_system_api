version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hote_information_system
    container_name: hotel_information_system
    restart: unless-stopped # automatically restart if something goes wrong and auto start on system reboot
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      - mysql
    networks:
      - tunnel
  
  nginx:
    image: nginx:alpine
    container_name: nginx_hotel_information_system
    restart: unless-stopped # automatically restart if something goes wrong and auto start on system reboot
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tunnel
  
  mysql:
    image: mysql:8
    container_name: hotel_information_system_db
    restart: unless-stopped # automatically restart if something goes wrong and auto start on system reboot
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: pass1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tunnel

networks:
  tunnel:
    external: true # tell docker to use existing network named "tunnel"

volumes:
  db_data: